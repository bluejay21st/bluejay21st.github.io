数据的语句数<br>*/<br>    protected static $transaction_valid = 0;<br><br>/*<br>初始化<br>*/<br>    protected static function init()<br>    &#123;<br>        $config = require(&#x27;config.php&#x27;);<br>        self::$config = $config;<br>        $pdo = new PDO(&#x27;mysql:host=&#x27;. $config[&#x27;location&#x27;] .&#x27;;port=&#x27;. $config[&#x27;hostport&#x27;] .&#x27;;dbname=&#x27;. $config[&#x27;database&#x27;] .&#x27;;&#x27;, $config[&#x27;username&#x27;], $config[&#x27;password&#x27;]);<br>        $pdo -&gt; query(&#x27;set names &#x27;. $config[&#x27;charset&#x27;]);<br>        $pdo-&gt;setAttribute(PDO::ATTR_STRINGIFY_FETCHES, false);<br>        $pdo-&gt;setAttribute(PDO::ATTR_EMULATE_PREPARES, false);<br>        self::$pdo = $pdo;<br>        include ROOT_PATH.&#x27;Query.php&#x27;;<br>    &#125;<br><br>/*<br>制定表全名并开始查询<br>table：完整的表名<br>*/<br>    public static function table($table)<br>    &#123;<br>        if(!self::$pdo) self::init();<br>        $querier = new Query(self::$pdo);<br>        return $querier-&gt;table($table);<br>    &#125;<br><br>/*<br>指定不带前缀的表名并开始查询<br>name：不带前缀的表名<br>*/<br>    public static function name($name)<br>    &#123;<br>        if(!self::$pdo) self::init();<br>        $querier = new Query(self::$pdo);<br>        return $querier-&gt;table(self::$config[&#x27;prefix&#x27;].$name);<br>    &#125;<br><br>/*<br>开启事务<br>*/<br>    public static function startTrans()<br>    &#123;<br>        self::$transaction = true;<br>        self::$transaction_exec = 0;<br>        self::$transaction_success = 0;<br>        self::$transaction_valid = 0;<br>        self::$pdo-&gt;beginTransaction();<br>        return true;<br>    &#125;<br><br>/*<br>提交事务并判断是否回滚<br><br>mode：事务模式<br>0、无条件提交<br>1、有SQL语句执行失败即回滚<br>2、有写入操作影响行数为0即回滚<br>*/<br>    public static function commit($mode = 1)<br>    &#123;<br>        self::$transaction = false;<br>        switch($mode)<br>        &#123;<br>            case 0:<br>                self::$pdo-&gt;commit();<br>                return true;<br>            case 1:<br>                if(self::$transaction_exec === self::$transaction_success)&#123;<br>                    self::$pdo-&gt;commit();<br>                    return true;<br>                &#125;else&#123;<br>                    $this-&gt;rollback();<br>                    return false;<br>                &#125;<br>                break;<br>            case 2:<br>                if(self::$transaction_exec === self::$transaction_success)&#123;<br>                    if(self::$transaction_exec === self::$transaction_valid)&#123;<br>                        self::$pdo-&gt;commit();<br>                        return true;<br>                    &#125;<br>                &#125;<br>                $this-&gt;rollback();<br>                return false;<br>            default:<br>                $this-&gt;rollback();<br>                return false;<br>        &#125;<br>    &#125;<br><br>/*<br>回滚事务<br>*/<br>    public static function rollback()<br>    &#123;<br>        self::$pdo-&gt;rollBack();<br>        self::$transaction = false;<br>        return true;<br>    &#125;<br><br>/*<br>执行语句数 + 1<br>*/<br>    public static function incExecNum()<br>    &#123;<br>        self::$transaction_exec++;<br>    &#125;<br><br>/*<br>执行成功语句数 + 1<br>*/<br>    public static function incSuccessNum()<br>    &#123;<br>        self::$transaction_success++;<br>    &#125;<br><br>/*<br>执行成功并影响数据的语句数 + 1<br>*/<br>    public static function incValidNum()<br>    &#123;<br>        self::$transaction_valid++;<br>    &#125;<br><br>    public static function error()<br>    &#123;<br>        print_r(self::$pdo-&gt;errorCode());<br>        print_r(self::$pdo-&gt;errorInfo());<br>    &#125;<br>&#125;<br></code></pre></td></tr></table></figure>

ected $order = &#x27;id&#x27;;<br><br>/*<br>限制查询数<br>*/<br>    protected $limit;<br><br>/*<br>实例化时存入PDO对象<br>*/<br>    public function __construct($pdo)<br>    &#123;<br>        $this-&gt;pdo = $pdo;<br>        return $this;<br>    &#125;<br><br>/*<br>设置表名<br>*/<br>    public function table($table)<br>    &#123;<br>        $this-&gt;table = $table;<br>        return $this;<br>    &#125;<br><br>/*<br>设置请求字段<br>*/<br>    public function field($field)<br>    &#123;<br>        if(strpos($field, &#x27;,&#x27;))&#123;<br>            $field = explode(&#x27;,&#x27;, $field);<br>            $field_tmp = null;<br>            foreach($field as $k=&gt;$row)&#123;<br>                if($k &gt; 0)&#123;<br>                    $field_tmp = $field_tmp .&#x27;,`&#x27;. $row .&#x27;`&#x27;;<br>                &#125;else&#123;<br>                    $field_tmp = $field_tmp .&#x27;`&#x27;. $row .&#x27;`&#x27;;<br>                &#125;<br>            &#125;<br>            $field = $field_tmp;<br>        &#125;<br>        $this-&gt;field = $field;<br>        return $this;<br>    &#125;<br><br>/*<br>设置where条件<br>*/<br>    public function where($key, $op, $value = null)<br>    &#123;<br>        if($value === null)&#123;<br>            $value = $op;<br>            $op = &#x27;=&#x27;;<br>        &#125;<br>        $this-&gt;where[] = [<br>            &#x27;key&#x27; =&gt; $key,<br>            &#x27;op&#x27; =&gt; $op,<br>            &#x27;value&#x27; =&gt; $value<br>        ];<br>        return $this;<br>    &#125;<br><br>/*<br>设置where下的or条件<br>*/<br>    public function whereOr($key, $op, $value = null)<br>    &#123;<br>        if($value === null)&#123;<br>            $value = $op;<br>            $op = &#x27;=&#x27;;<br>        &#125;<br>        $this-&gt;whereOr[] = [<br>            &#x27;key&#x27; =&gt; $key,<br>            &#x27;op&#x27; =&gt; $op,<br>            &#x27;value&#x27; =&gt; $value<br>        ];<br>        return $this;<br>    &#125;<br><br>/*<br>生成where条件的SQL语句与数据数组<br>*/<br>    protected function whereBuilder()<br>    &#123;<br>        $sql = null; $data = [];<br>        if($this-&gt;where)&#123;<br>            foreach($this-&gt;where as $k=&gt;$row)&#123;<br>                if($k &gt; 0)&#123;<br>                    $sql = $sql . &#x27;AND `&#x27;. $row[&#x27;key&#x27;] .&#x27;` &#x27;. $row[&#x27;op&#x27;] . &#x27; &#x27;;<br>                &#125;else&#123;<br>                    $sql = $sql . &#x27;WHERE `&#x27;. $row[&#x27;key&#x27;] .&#x27;` &#x27;. $row[&#x27;op&#x27;] . &#x27; &#x27;;<br>                &#125;<br>                if($row[&#x27;op&#x27;] === &#x27;in&#x27;)&#123;<br>                    $sql = $sql . &#x27;(&#x27;;<br>                    foreach($row[&#x27;value&#x27;] as $r_k=&gt;$r_v)&#123;<br>                        if($r_k &gt; 0)&#123;<br>                            $sql = $sql . &#x27;,?&#x27;;<br>                        &#125;else&#123;<br>                            $sql = $sql . &#x27;?&#x27;;<br>                        &#125;<br>                        $data[] = $r_v;<br>                    &#125;<br>                    $sql = $sql . &#x27;) &#x27;;<br>                &#125;else&#123;<br>                    $sql = $sql . &#x27;? &#x27;;<br>                    $data[] = $row[&#x27;value&#x27;];<br>                &#125;<br>            &#125;<br>        &#125;<br>        if($this-&gt;whereOr)&#123;<br>            foreach($this-&gt;whereOr as $row)&#123;<br>                $sql = $sql . &#x27;OR `&#x27;. $row[&#x27;key&#x27;] .&#x27;` &#x27;. $row[&#x27;op&#x27;] . &#x27; &#x27;;<br>                if($row[&#x27;op&#x27;] === &#x27;in&#x27;)&#123;<br>                    $sql = $sql . &#x27;(&#x27;;<br>                    foreach($row[&#x27;value&#x27;] as $r_k=&gt;$r_v)&#123;<br>                        if($r_k &gt; 0)&#123;<br>                            $sql = $sql . &#x27;,?&#x27;;<br>                        &#125;else&#123;<br>                            $sql = $sql . &#x27;?&#x27;;<br>                        &#125;<br>                        $data[] = $r_v;<br>                    &#125;<br>                    $sql = $sql . &#x27;) &#x27;;<br>                &#125;else&#123;<br>                    $sql = $sql . &#x27;? &#x27;;<br>                    $data[] = $row[&#x27;value&#x27;];<br>                &#125;<br>            &#125;<br>        &#125;<br>        return [<br>            &#x27;sql&#x27; =&gt; $sql,<br>            &#x27;data&#x27; =&gt; $data<br>        ];<br>    &#125;<br><br>/*<br>设置排序字段<br>*/<br>    public function order($order)<br>    &#123;<br>        $this-&gt;order = $order;<br>        return $this;<br>    &#125;<br><br>/*<br>设置限制查询数<br>*/<br>    public function limit($num)<br>    &#123;<br>        $this-&gt;limit = $num;<br>        return $this;<br>    &#125;<br><br>/*<br>查询特定字段<br>*/<br>    public function value($field)<br>    &#123;<br>        $param = $this-&gt;whereBuilder();<br>        $sql = &#x27;SELECT `&#x27;. $field . &#x27;` FROM `&#x27;. $this-&gt;table .&#x27;` &#x27;. $param[&#x27;sql&#x27;] .&#x27;LIMIT 1;&#x27;;<br>        $obj = $this-&gt;pdo-&gt;prepare($sql);<br>        if(!$obj) return Db::error();<br>        $res = $obj-&gt;execute($param[&#x27;data&#x27;]);<br>        $list = $obj-&gt;fetchAll(PDO::FETCH_ASSOC);<br>        if(isset($list[0][$field]))&#123;<br>            return $list[0][$field];<br>        &#125;else&#123;<br>            return false;<br>        &#125;<br>    &#125;<br><br>/*<br>查询一条记录<br>*/<br>    public function find()<br>    &#123;<br>        $param = $this-&gt;whereBuilder();<br>        $sql = &#x27;SELECT &#x27;. $this-&gt;field . &#x27; FROM `&#x27;. $this-&gt;table .&#x27;` &#x27;. $param[&#x27;sql&#x27;] .&#x27;LIMIT 1;&#x27;;<br>        $obj = $this-&gt;pdo-&gt;prepare($sql);<br>        if(!$obj) return Db::error();<br>        $res = $obj-&gt;execute($param[&#x27;data&#x27;]);<br>        $data = $obj-&gt;fetchAll(PDO::FETCH_ASSOC);<br>        if(isset($data[0]))&#123;<br>            return $data[0]
